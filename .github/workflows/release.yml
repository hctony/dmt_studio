name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: dmt-next
      - run: python -m unittest discover -s dmt-next -p 'test_*.py'
      - run: ./dmt-next/build.ps1
      - run: python dmt-next/smoke-frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dmt-next/release/*.exe
            dmt-next/release/*.blockmap
            dmt-next/release/latest.yml
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "DMT Analysis Studio $env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare release' }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish draft
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always
        working-directory: dmt-next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
