appId: com.dmt.analysis.studio
productName: DMT Analysis Studio
directories:
  output: release
files:
  - desktop.js
  - desktop-preload.js
  - gui-client.js
  - updater.js
  - lifecycle.js
  - assets/tray.ico
  - ui/studio.html
  - ui/studio.js
  - ui/model-settings.js
  - ui/workflow.js
  - ui/update-dialog.js
  - ui/backend-recovery.js
  - ui/studio.css
  - ui/translations.js
  - ui/translations.json
  - package.json
extraResources:
  - from: backend-dist/dmt-service
    to: backend
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: hctony
  repo: dmt_studio
  releaseType: draft
