<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DMT 작업 프로필</title>
<style>*{box-sizing:border-box}body{font:14px 'Segoe UI','Microsoft JhengHei',sans-serif;max-width:850px;margin:36px auto;padding:32px 40px;color:#172b43;background:#fff;border:1px solid #e1eaf4;border-radius:16px;box-shadow:0 12px 38px #1b3d5e12}html{min-height:100%;background:#f2f6fb}h1{font-size:28px;margin:14px 0 6px}p{color:#687e96;line-height:1.5}label{display:block;margin:18px 0 7px;font-size:12px;font-weight:600;color:#536a83}input,select{padding:10px;width:100%;border:1px solid #d4e1ed;border-radius:7px;background:white;color:#172b43;font:inherit}input:focus,select:focus{outline:2px solid #8dbef1}body>select:first-child{float:right;width:auto}button{padding:10px 15px;margin:12px 6px 0 0;border:0;border-radius:7px;background:#eaf2fb;color:#285c90;font-weight:600;cursor:pointer}button[type=submit]{background:#2675ca;color:white}.row{display:flex;gap:8px}.row button{margin:0;white-space:nowrap}#status{color:#344d64;white-space:pre-wrap}form{border-top:1px solid #e8eef5;margin-top:24px;padding-top:8px}</style></head>
<body><h1>작업 프로필</h1><p>모델과 LOT, 자주 사용하는 경로를 프로필별로 저장합니다.</p><button id="import">기존 모델 설정 가져오기</button><label for="profiles">저장된 프로필</label><select id="profiles"></select><button id="new">새 프로필</button><button id="delete">선택 삭제</button><form id="form"><label for="name">프로필 이름</label><input id="name" required><label for="model">모델</label><input id="model"><label for="lot">LOT</label><input id="lot"><label for="nasRoot">NAS 루트 경로</label><input id="nasRoot" placeholder="/Pixel/ResultData/Data"><div id="paths"></div><button type="submit">저장</button></form><p id="status" role="status"></p><script src="renderer.js"></script><script src="workbench.js"></script></body></html>
